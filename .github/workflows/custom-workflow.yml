name: Custom Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main  # or your deployment branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      # Set Node.js version compatible with Vite
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Build And Deploy
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_FLOWER_086FD3D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Default GitHub token
          action: "upload"
          app_location: "/"        # where package.json is
          api_location: ""         # leave blank if no Azure Functions
          output_location: "dist"  # Vite default build folder
